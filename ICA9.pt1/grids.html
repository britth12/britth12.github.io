<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Challenges - ICA9pt1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="challenge">
        <div class="grid1">
            <div>One</div>
            <div>Two</div>
            <div>Three</div>
            <div>Four</div>
        </div>
    </section>

    <section class="challenge">
        <div class="grid2">
            <div class="item2-1">One</div>
            <div class="item2-2">Two</div>
        </div>
    </section>

    <section class="challenge">
        <div class="grid3">
            <div class="area3-one">One</div>
            <div class="area3-two">Two</div>
            <div class="area3-three">Three</div>
            <div class="area3-four">Four</div>
        </div>
    </section>

    <section class="challenge">
        <div class="container4">
            <div class="card4">
                <img
                    alt="a single red balloon"
                    src="https://mdn.github.io/shared-assets/images/examples/balloons1.jpg" />
                <ul class="tags4">
                    <li>balloon</li>
                    <li>red</li>
                    <li>sky</li>
                    <li>blue</li>
                    <li>Hot air balloon</li>
                </ul>
            </div>
            <div class="card4">
                <img
                    alt="balloons over some houses"
                    src="https://mdn.github.io/shared-assets/images/examples/balloons2.jpg" />
                <ul class="tags4">
                    <li>balloons</li>
                    <li>houses</li>
                    <li>train</li>
                    <li>harborside</li>
                </ul>
            </div>
            <div class="card4">
                <img
                    alt="close-up of balloons inflating"
                    src="https://mdn.github.io/shared-assets/images/examples/balloons3.jpg" />
                <ul class="tags4">
                    <li>balloons</li>
                    <li>inflating</li>
                    <li>green</li>
                    <li>blue</li>
                </ul>
            </div>
            <div class="card4">
                <img
                    alt="a balloon in the sun"
                    src="https://mdn.github.io/shared-assets/images/examples/balloons4.jpg" />
                <ul class="tags4">
                    <li>balloon</li>
                    <li>sun</li>
                    <li>sky</li>
                    <li>summer</li>
                    <li>bright</li>
                </ul>
            </div>
        </div>
    </section>
</body>
</html>
